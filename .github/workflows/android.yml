name: Android app

on:
  push:
    paths:
      - 'android/**'
      - 'docs/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build the APKs
        working-directory: android
        env:
          RS_BUILD: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: List them
        run: ls -la android/app/build/outputs/apk/release/

      - name: Test clip
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p android-smoke/media
          ffmpeg -hide_banner -loglevel error -y -f lavfi -i 'testsrc2=size=1280x720:rate=30' -f lavfi -i 'sine=frequency=440:sample_rate=48000' \
            -t 6 -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest android-smoke/media/clip.mp4

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run it on an Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          disk-size: 6000M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: bash android/smoke.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-test
          path: android-smoke
          retention-days: 14
          if-no-files-found: ignore

      - name: Collect the release files
        run: |
          mkdir -p dist
          d=android/app/build/outputs/apk/release
          cp $d/*arm64-v8a*.apk dist/RipStitch.apk
          cp $d/*armeabi-v7a*.apk dist/RipStitch-32bit.apk
          cp $d/*x86_64*.apk dist/RipStitch-x86_64.apk
          printf '{"versionCode": %d, "versionName": "1.0.%d"}\n' $((100 + ${{ github.run_number }})) ${{ github.run_number }} > dist/android-version.json
          for f in android-smoke/shots/*.png; do [ -f "$f" ] && cp "$f" "dist/screenshot-$(basename $f)"; done
          ls -la dist

      - uses: actions/upload-artifact@v4
        with:
          name: RipStitch-android
          path: dist
          retention-days: 14

      - name: Publish to the android-latest release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/RipStitch.apk -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          **RipStitch for Android.** Rip and Stitch on your phone, with yt-dlp, FFmpeg and everything else built in. Downloads go to *Download/RipStitch*.

          1. On your phone, download **RipStitch.apk** below and open it. (Phones from before about 2017 may need **RipStitch-32bit.apk**.)
          2. Android asks whether your browser may install apps: allow it, then tap **Install**. If Play Protect warns about an unknown app, tap **More details → Install anyway**. RipStitch isn't on the Play Store, because Google doesn't allow apps that download from YouTube.
          3. Open RipStitch. The first start unpacks its engine, which takes about half a minute.

          Share a link from YouTube or any app with **Share → RipStitch**, or share videos to **Edit in Stitch**. To update, install a newer RipStitch.apk over this one: your settings and downloads stay. The app tells you when one is out.

          Version 1.0.${{ github.run_number }}, built from $env:GITHUB_SHA and tested on an Android emulator: a real download, audio conversion, Stitch and an export. Needs Android 7 or newer. SHA-256 of RipStitch.apk: ``$hash``
          "@
          $files = @(Get-ChildItem dist -File | ForEach-Object { $_.FullName })
          ./installer/publish.ps1 -Tag android-latest -Files $files -Title 'RipStitch for Android' -Notes $notes
