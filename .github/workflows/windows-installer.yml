name: Windows builds

# One bundle (Python + yt-dlp + FFmpeg + Deno + engine), two products, each tested on a clean
# Windows runner before it's published:
#   RipStitch-Setup.exe  installs the background engine for the website   -> release "engine-latest"
#   RipStitch.exe        standalone desktop app with its own window       -> release "desktop-latest"
on:
  push:
    paths:
      - 'docs/**'
      - 'installer/**'
      - 'desktop/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-builds-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  bundle:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the bundle
        run: ./installer/build-windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: build/RipStitch
          compression-level: 1
          retention-days: 2

  installer:
    needs: bundle
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: build/RipStitch
      - name: Read the engine version
        run: |
          $v = (Get-Content build\RipStitch\installed.json -Raw | ConvertFrom-Json).engine
          "RS_VERSION=$v" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Build the installer
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $guess = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $guess)) { choco install innosetup -y --no-progress | Out-Null }
            $iscc = Get-Item $guess
          }
          & $iscc.Source /Qp installer\ripstitch.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $f = Get-Item dist\RipStitch-Setup.exe
          "Installer: {0:N1} MB" -f ($f.Length / 1MB)
      - name: Install it and run real downloads
        run: ./installer/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: RipStitch-Setup
          path: dist/RipStitch-Setup.exe
          retention-days: 14
      - name: Publish to the engine-latest release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash dist\RipStitch-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          **RipStitch Engine $env:RS_VERSION for Windows**: everything the website's Rip tab needs in one installer (Python, yt-dlp, FFmpeg, Deno).

          1. Download **RipStitch-Setup.exe** below and run it. No admin rights needed.
          2. If Windows SmartScreen says *Windows protected your PC*, click **More info** and then **Run anyway**. The installer isn't code-signed.
          3. That's it. The engine starts with Windows, runs in the background and keeps yt-dlp up to date. Open https://mattymattmattmatt.github.io/RipStitch/ and paste a link.

          Built from $env:GITHUB_SHA and tested on a clean Windows runner. SHA-256: ``$hash``
          "@
          ./installer/publish.ps1 -Tag engine-latest -Files dist\RipStitch-Setup.exe -Title 'RipStitch Engine for Windows (for the website)' -Notes $notes -Latest

  desktop:
    needs: bundle
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: build/RipStitch
      - name: Build RipStitch.exe
        run: ./installer/build-desktop.ps1
      - name: Launch it and run real downloads
        run: ./installer/smoke-desktop.ps1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: desktop-screenshots
          path: dist/desktop-smoke
          retention-days: 14
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: RipStitch-desktop
          path: dist/RipStitch.exe
          retention-days: 14
      - name: Publish to the desktop-latest release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $hash = (Get-FileHash dist\RipStitch.exe -Algorithm SHA256).Hash.ToLower()
          $v = (Get-Content build\RipStitch\installed.json -Raw | ConvertFrom-Json).engine
          $notes = @"
          **RipStitch for Windows: the standalone desktop app.** Rip and Stitch in their own window. No browser, no install, everything built in.

          1. Download **RipStitch.exe** below and double-click it. Keep it anywhere, e.g. your Desktop.
          2. If Windows SmartScreen says *Windows protected your PC*, click **More info** and then **Run anyway**. The app isn't code-signed.
          3. The first launch unpacks its engine (about 30 seconds). After that it opens in a couple of seconds.

          Needs Windows 10 or 11 (64-bit) with the Microsoft Edge WebView2 Runtime, which Windows already includes. Engine $v, built from $env:GITHUB_SHA and tested on a clean Windows runner. SHA-256: ``$hash``
          "@
          $shots = Get-ChildItem dist\desktop-smoke -Filter 'desktop-*.png' | ForEach-Object { $t = Join-Path dist ('screenshot-' + $_.Name.Substring(8)); Copy-Item $_.FullName $t; $t }
          ./installer/publish.ps1 -Tag desktop-latest -Files (@('dist\RipStitch.exe') + $shots) -Title 'RipStitch Desktop for Windows (standalone app)' -Notes $notes
