name: Windows installer

# Builds RipStitch-Setup.exe (engine + Python + yt-dlp + FFmpeg + Deno), installs it on a clean
# Windows runner and runs real downloads through it, then publishes it to the "engine-latest"
# release so the website's download button always points at a tested build.
on:
  push:
    paths:
      - 'docs/engine/**'
      - 'installer/**'
      - '.github/workflows/windows-installer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 40
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the bundle
        run: ./installer/build-windows.ps1

      - name: Build the installer
        run: |
          $iscc = Get-Command iscc.exe -ErrorAction SilentlyContinue
          if (-not $iscc) {
            $guess = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
            if (-not (Test-Path $guess)) { choco install innosetup -y --no-progress | Out-Null }
            $iscc = Get-Item $guess
          }
          & $iscc.Source /Qp installer\ripstitch.iss
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $f = Get-Item dist\RipStitch-Setup.exe
          "Installer: {0:N1} MB" -f ($f.Length / 1MB)
          "SHA256: " + (Get-FileHash $f -Algorithm SHA256).Hash

      - name: Install it and run real downloads
        run: ./installer/smoke-test.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: RipStitch-Setup
          path: dist/RipStitch-Setup.exe
          retention-days: 14

      - name: Publish to the engine-latest release
        if: github.ref_name == github.event.repository.default_branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'engine-latest'
          $hash = (Get-FileHash dist\RipStitch-Setup.exe -Algorithm SHA256).Hash.ToLower()
          $notes = @"
          **RipStitch Engine $env:RS_VERSION for Windows**: everything Rip needs in one installer (Python, yt-dlp, FFmpeg, Deno).

          1. Download **RipStitch-Setup.exe** below and run it. No admin rights needed.
          2. If Windows SmartScreen says *Windows protected your PC*, click **More info** and then **Run anyway**. The installer isn't code-signed.
          3. That's it. The engine starts with Windows, runs in the background and keeps yt-dlp up to date. Open https://mattymattmattmatt.github.io/RipStitch/ and paste a link.

          Built from $env:GITHUB_SHA and tested on a clean Windows runner. SHA-256: ``$hash``
          "@ -replace '(?m)^ {10}', ''
          gh release view $tag *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag dist\RipStitch-Setup.exe --title 'RipStitch for Windows' --notes $notes --target $env:GITHUB_SHA --latest
          } else {
            gh release upload $tag dist\RipStitch-Setup.exe --clobber
            gh release edit $tag --notes $notes --title 'RipStitch for Windows'
          }
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
